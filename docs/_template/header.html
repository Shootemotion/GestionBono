<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    font-size: 8pt;
    color: #64748b;
    margin: 0;
    padding: 10px 18mm 0 18mm;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 4px;
  }
  .left {
    font-weight: 700;
    color: #2563eb;
    letter-spacing: 1px;
  }
  .right {
    color: #94a3b8;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="header">
    <span class="left">DIAGNOS — Plataforma de Desempeño</span>
    <span class="right" id="doc-title"></span>
  </div>
  <script>
    function subst() {
      var vars = {};
      var x = document.location.search.substring(1).split('&');
      for (var i in x) {
        var z = x[i].split('=', 2);
        vars[z[0]] = decodeURIComponent(z[1] || '');
      }
      document.getElementById('doc-title').textContent = vars['doctitle'] || '';
    }
    subst();
  </script>
</body>
</html>
