<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    font-size: 8pt;
    color: #64748b;
    margin: 0;
    padding: 0 18mm 10px 18mm;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #e2e8f0;
    padding-top: 4px;
  }
  .left {
    font-weight: 800;
    color: #b91c1c;
    font-size: 7.5pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .right {
    color: #475569;
  }
</style>
</head>
<body>
  <div class="footer">
    <span class="left">Confidencial — Uso interno</span>
    <span class="right">
      Página <span id="page"></span> de <span id="topage"></span>
    </span>
  </div>
  <script>
    function subst() {
      var vars = {};
      var x = document.location.search.substring(1).split('&');
      for (var i in x) {
        var z = x[i].split('=', 2);
        vars[z[0]] = decodeURIComponent(z[1] || '');
      }
      document.getElementById('page').textContent = vars['page'] || '';
      document.getElementById('topage').textContent = vars['topage'] || '';
    }
    subst();
  </script>
</body>
</html>
